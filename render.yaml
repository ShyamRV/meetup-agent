# Render blueprint — auto-detected at https://dashboard.render.com when
# this file lives at the repo root. Spinning up a "Blueprint" instance
# from this repo creates the web service with the right Dockerfile +
# health-check path; you supply secret env vars in the Render UI
# (marked ``sync: false`` below).
services:
  - type: web
    name: meetup-networking-agent
    plan: starter
    runtime: docker
    dockerfilePath: meetup-networking-agent/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      # --- Transport ---------------------------------------------------
      - key: AGENT_NAME
        value: meetup-networking-agent
      - key: AGENT_MAILBOX
        value: "true"
      - key: AGENT_HANDLE
        value: meetup-networking-agent
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # --- Secrets — set in the Render dashboard ----------------------
      - key: AGENT_SEED
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false

      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      - key: DEFAULT_EVENT_ID
        sync: false

      - key: SENTRY_DSN
        sync: false
