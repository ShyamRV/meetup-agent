[project]
name = "agents-shared"
version = "0.1.0"
description = "Shared building blocks for innovation-lab agents (Sentry, health, security_fetch, vector, rate_limit, db, logging)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Innovation Lab" }]

dependencies = [
    "aiohttp>=3.9.5,<4.0",
    "asyncpg>=0.29.0,<0.31",
    "pgvector>=0.3.0,<0.4",
    "pydantic>=2.7,<3.0",
    "sentry-sdk>=2.10,<3.0",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "SIM108"]
