[project]
name = "meetup-networking-agent"
version = "1.0.0"
description = "ASI:One chat agent that matches meetup attendees by LinkedIn + GitHub profiles using semantic embeddings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Innovation Lab" }]
keywords = ["uagents", "fetch.ai", "asi1", "networking", "meetup", "pgvector"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "uagents>=0.18,<0.30",
    "uagents-core>=0.4.0",
    "agents-shared",
    "aiohttp>=3.9.5,<4.0",
    "asyncpg>=0.29.0,<0.31",
    "pgvector>=0.3.0,<0.4",
    "pydantic>=2.7,<3.0",
    "sentry-sdk>=2.10,<3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
meetup-networking-agent = "agent:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handlers", "models", "db", "prompts"]
include = [
    "agent.py",
    "callback_server.py",
    "config.py",
    "session.py",
    "prompts/*.txt",
]

[tool.uv.sources]
agents-shared = { path = "../agents_shared", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008", # Do not perform function call in argument defaults (FastAPI / Pydantic friendly).
    "SIM108", # ternary suggestion is sometimes worse than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
